[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-inline-actions"
version = "2.4.0"
description = "django-inline-actions adds actions to each row of the ModelAdmin or InlineModelAdmin."
authors = [{ name = "Alexander Frenzel", email = "alex@relatedworks.com" }]
license = "BSD-3-Clause"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["django>=5.2"]

[project.urls]
Documentation = "https://github.com/escaped/django-inline-actions/blob/master/README.md"
Homepage = "https://github.com/escaped/django-inline-actions"
Repository = "https://github.com/escaped/django-inline-actions"

[dependency-groups]
dev = [
  "django-webtest>=1.9.12",
  "lxml>=4.9",
  "mypy>=1.11",
  "pre-commit>=4.0",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pytest-django>=4.9",
  "pytest-mock>=3.14",
  "ruff>=0.9",
]

[tool.hatch.build.targets.wheel]
packages = ["inline_actions"]

[tool.ruff]
line-length = 88
target-version = "py310"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["A", "B", "C4", "E", "F", "I", "N", "T10", "W"]
ignore = ["E501"]

[tool.ruff.format]
# Keep the existing single-quote style to avoid a reformat-only diff.
quote-style = "preserve"

[tool.pytest.ini_options]
addopts = ["--durations=10", "--cov=inline_actions", "--cov-report=term-missing"]
norecursedirs = ["build", "dist"]
testpaths = ["inline_actions", "test_proj"]

[tool.coverage.run]
relative_files = true
branch = true

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __unicode__",
  "def __repr__",
  "def __str__",
  "raise AssertionError",
  "raise NotImplementedError",
  "if __name__ == __main__:",
  "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.10"
files = ["inline_actions"]
ignore_missing_imports = true
