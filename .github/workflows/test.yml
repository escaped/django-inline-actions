name: Test & Lint

on:
  pull_request:
  push:
    branches:
      - master
      - main

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python 3.12
      - name: Lint & format
        run: |
          uv run --no-sync ruff check .
          uv run --no-sync ruff format --check .
      - name: Type check
        run: uv run --no-sync mypy

  test:
    name: Django ${{ matrix.django }} / Python ${{ matrix.python }}
    needs: [lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # previous LTS (EOL April 2026)
          - python: '3.10'
            django: '4.2'
          - python: '3.12'
            django: '4.2'
          # current LTS
          - python: '3.10'
            django: '5.2'
          - python: '3.13'
            django: '5.2'
          - python: '3.14'
            django: '5.2'
          # latest release
          - python: '3.12'
            django: '6.1'
          - python: '3.14'
            django: '6.1'
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Set up uv and Python ${{ matrix.python }}
        uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --python ${{ matrix.python }}
      - name: Pin Django ${{ matrix.django }}
        run: uv pip install "Django~=${{ matrix.django }}.0"
      - name: Run tests
        run: uv run --no-sync pytest --cov-report=lcov:coverage/lcov.info
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          flag-name: django-${{ matrix.django }}-py${{ matrix.python }}
          parallel: true

  coveralls_finish:
    name: Coveralls Finished
    needs: [test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Coveralls Finished
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
